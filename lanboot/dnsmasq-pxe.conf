# Proxy-DHCP und TFTP fuer Raspberry-Pi-Netboot
# Die Fritz!Box bleibt DHCP-Server und vergibt weiter die IP-Adressen.
# dnsmasq vergibt KEINE Adressen, sondern beantwortet nur die Boot-Anfragen
# der Pi-BootROMs und verweist auf diesen TFTP-Server.

# DNS komplett abschalten - das macht die Fritz!Box.
port=0

# Nur am Kabel-Interface arbeiten. wlan0 haengt im selben Subnetz und
# wuerde zu doppelten Antworten fuehren.
interface=eth0
except-interface=wlan0
bind-interfaces

no-hosts
no-resolv

# Proxy-DHCP-Modus: keine Adressvergabe, nur Boot-Informationen.
# Die Adresse dient nur der Subnetz-Zuordnung; die offizielle Doku
# verwendet hier die Broadcast-Adresse des Netzes.
dhcp-range=192.168.188.255,proxy

# Der Boot-String MUSS genau "Raspberry Pi Boot" lauten, ohne angehaengte
# Leerzeichen. dnsmasq baut Option 43 selbst und setzt das Laengenfeld
# passend (0x11 = 17 Zeichen). Mit drei zusaetzlichen Leerzeichen stehen
# 20 Zeichen im Feld und das BootROM des 3B verwirft die DHCP-Antwort.
pxe-service=0,"Raspberry Pi Boot"

# TFTP-Wurzel liegt auf dem NAS, nicht lokal auf der SD-Karte des Servers.
# Darin: bootcode.bin als echte Datei, und pro Client ein Symlink mit der
# Seriennummer, der in das /boot/firmware des jeweiligen Rootfs zeigt.
# Damit liefert TFTP genau die Dateien aus, die ein "apt upgrade" auf dem
# Client selbst aktualisiert - kein Versionsbruch zwischen Kernel und
# Modulen mehr, und ein Client-Klon per "cp -a" nimmt seine Bootdateien mit.
enable-tftp
tftp-root=/srv/nfs/netboot/tftpboot

# Das BootROM handelt TFTP-Blocksizes unzuverlaessig aus.
tftp-no-blocksize

# Ausfuehrliches Logging, nur zum Einrichten. Im Betrieb abgeschaltet, weil
# es bei jedem Startvorgang das Journal fuellt. Zum Wiedereinschalten die
# Zeile entkommentieren, ausspielen und dnsmasq neu starten -- ohne sie
# zeigt das Log keine DHCP-Option 43 mehr, also auch nicht die
# Laengenkontrolle des Boot-Strings aus Abschnitt 4.
#log-dhcp
